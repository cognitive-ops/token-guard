# Pre-commit hooks for claude-code-roi-analytics
# Install with: pre-commit install   (and: pre-commit install --hook-type commit-msg)
# Run on all files: pre-commit run --all-files
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  # --- General hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        args: [--allow-multiple-documents]
        # CloudFormation templates use !Ref/!GetAtt tags the generic loader can't resolve
        exclude: ^alarms/cloudformation\.yaml$
      - id: check-json
        # tokenizer.json is a Git LFS artifact; on non-LFS checkouts (CI) it is a
        # pointer file, not JSON, so the generic loader can't decode it
        exclude: ^prompt-intent-classifier/deploy-model/tokenizer\.json$
      - id: check-executables-have-shebangs
      - id: detect-private-key

  # --- Python lint + format ------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- Shell scripts -------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # --- Dockerfiles ---------------------------------------------------------
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.12.1b3
    hooks:
      - id: hadolint  # rules configured in .hadolint.yaml

  # --- Secret scanning -----------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
