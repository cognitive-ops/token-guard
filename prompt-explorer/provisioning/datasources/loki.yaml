apiVersion: 1

# Two Loki sources so you can flip the dashboard's "Data source" dropdown between them.
#   - local : the repo-root docker-compose `loki` service (`docker compose up -d loki`),
#             seeded via tools/seed-demo-data.py. Default — no AWS needed.
#   - online: production Loki, only reachable if you set up an SSM port-forward yourself.
# URLs come from env (set in docker-compose.yml) so nothing is hard-coded.
datasources:
  - name: "Loki (local)"
    type: loki
    uid: loki-local
    access: proxy
    url: $LOCAL_LOKI_URL
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000

  - name: "Loki (online · prod via SSM)"
    type: loki
    uid: loki-online
    access: proxy
    url: $ONLINE_LOKI_URL
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
