      target_label: project_name
      replacement: Agent Studio
    - source_labels:
      - project_name
      - repository_fullname
      separator: ;
      regex: ;scopic\-software/vexa\-test\-management
      target_label: project_name
      replacement: Vexa
    - source_labels:
      - project_name
      - repository_fullname
      separator: ;
      regex: ;scopic\-software/zoom\-radar\-customer\-portal
      target_label: project_name
      replacement: Zoom Radar
    - source_labels:
      - project_name
      - repository_fullname
      separator: ;
      regex: ;scopic\-software/zoomradar\-wordpress
      target_label: project_name
      replacement: Zoom Radar
    # Fallback — MUST stay last. Any repo not matched by a rule above keeps its
    # raw repository_fullname as project_name, instead of collapsing into a
    # blank/unlabeled slice. Only fires when project_name is still empty and a
    # repo is present (regex requires a non-empty repo after the leading ";").
    - source_labels:
      - project_name
      - repository_fullname
      separator: ;
      regex: ;(.+)
      target_label: project_name
      replacement: $1
    # Desktop app has no git working directory, so it can never carry a
    # repository.fullname attribute. Label it explicitly instead of leaving a
    # blank "Value" slice. Fires only when project_name is still empty.
    - source_labels:
      - project_name
      - service_name
      separator: ;
      regex: ;claude-code-desktop
      target_label: project_name
      replacement: No Repo/Project - Desktop App
    # Anything still empty = a CLI (or other) session that never emitted a
    # repository.fullname attribute (env not loaded at launch). MUST stay last.
    - source_labels:
      - project_name
      regex: ^$
      target_label: project_name
      replacement: No Repo/Project - CLI App
    - source_labels:
      - repository_fullname
      - service_name
      separator: ;
      regex: ;claude-code-desktop
      target_label: repository_fullname
      replacement: No Repo/Project - Desktop App
    - source_labels:
      - repository_fullname
      regex: ^$
      target_label: repository_fullname
      replacement: No Repo/Project - CLI App
    - source_labels:
      - repository_host
      - service_name
      separator: ;
      regex: ;claude-code-desktop
      target_label: repository_host
      replacement: No Repo/Project - Desktop App
    - source_labels:
      - repository_host
      regex: ^$
      target_label: repository_host
      replacement: No Repo/Project - CLI App

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the billing exporter (real per-developer cost from the Admin API)
  - job_name: 'billing-exporter'
    scrape_interval: 5m
    static_configs:
      - targets: ['billing-exporter:9105']

  # Scrape the prompt-language exporter (prompt language detection from Loki)
  - job_name: 'prompt-lang-exporter'
    scrape_interval: 5m
    static_configs:
      - targets: ['prompt-lang-exporter:9106']

  # Scrape the prompt-intent exporter (intent + behavior classification from Loki)
  - job_name: 'prompt-intent-exporter'
    scrape_interval: 5m
    static_configs:
      - targets: ['prompt-intent-exporter:9107']

  # Scrape the prompt-tool exporter (tool usage aggregation from Loki)
  - job_name: 'prompt-tool-exporter'
    scrape_interval: 5m
    static_configs:
      - targets: ['prompt-tool-exporter:9108']

  # Add additional scraping targets here if needed
  # - job_name: 'your-app'
  #   static_configs:
  #     - targets: ['your-app:8080']
