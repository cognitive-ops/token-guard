global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus-rules.yml"

scrape_configs:
  # Scrape the OpenTelemetry Collector metrics endpoint
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    metric_relabel_configs:
    # Default: project_name = raw repository_fullname, instead of collapsing
    # into a blank/unlabeled slice. Add per-repo overrides above this rule if
    # you want friendlier display names for specific projects.
    - source_labels:
      - project_name
      - repository_fullname
      separator: ;
      regex: ;(.+)
      target_label: project_name
      replacement: $1
    # Desktop app has no git working directory, so it can never carry a
    # repository.fullname attribute. Label it explicitly instead of leaving a
    # blank "Value" slice. Fires only when project_name is still empty.
    - source_labels:
      - project_name
      - service_name
      separator: ;
      regex: ;claude-code-desktop
      target_label: project_name
      replacement: No Repo/Project - Desktop App
    # Anything still empty = a CLI (or other) session that never emitted a
    # repository.fullname attribute (env not loaded at launch). MUST stay last.
    - source_labels:
      - project_name
      regex: ^$
      target_label: project_name
      replacement: No Repo/Project - CLI App
    - source_labels:
      - repository_fullname
      - service_name
      separator: ;
      regex: ;claude-code-desktop
      target_label: repository_fullname
      replacement: No Repo/Project - Desktop App
    - source_labels:
      - repository_fullname
      regex: ^$
      target_label: repository_fullname
      replacement: No Repo/Project - CLI App
    - source_labels:
      - repository_host
      - service_name
      separator: ;
      regex: ;claude-code-desktop
      target_label: repository_host
      replacement: No Repo/Project - Desktop App
    - source_labels:
      - repository_host
      regex: ^$
      target_label: repository_host
      replacement: No Repo/Project - CLI App

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the billing exporter (real per-developer cost from the Admin API)
  - job_name: 'billing-exporter'
    scrape_interval: 5m
    static_configs:
      - targets: ['billing-exporter:9105']

  # Scrape the prompt-language exporter (prompt language detection from Loki)
  - job_name: 'prompt-lang-exporter'
    scrape_interval: 5m
    static_configs:
      - targets: ['prompt-lang-exporter:9106']

  # Scrape the prompt-intent exporter (intent + behavior classification from Loki)
  - job_name: 'prompt-intent-exporter'
    scrape_interval: 5m
    static_configs:
      - targets: ['prompt-intent-exporter:9107']

  # Scrape the prompt-tool exporter (tool usage aggregation from Loki)
  - job_name: 'prompt-tool-exporter'
    scrape_interval: 5m
    static_configs:
      - targets: ['prompt-tool-exporter:9108']

  # Scrape the prompt-refactor exporter (rephrase-pair detection + tokens/latency-saved estimate)
  - job_name: 'prompt-refactor-exporter'
    scrape_interval: 5m
    static_configs:
      - targets: ['prompt-refactor-exporter:9109']

  # Add additional scraping targets here if needed
  # - job_name: 'your-app'
  #   static_configs:
  #     - targets: ['your-app:8080']
