# Ruff configuration — https://docs.astral.sh/ruff/
target-version = "py310"
line-length = 100

exclude = [
  "__pycache__",
  ".git",
  ".secrets",
]

[lint]
# pycodestyle (E/W), Pyflakes (F), isort (I), pyupgrade (UP),
# flake8-bugbear (B), flake8-comprehensions (C4)
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
  "E501",  # line length handled by the formatter, not enforced as a hard error
]

[lint.per-file-ignores]
# prompt-intent-classifier utility/training scripts use `for l in open(...)` idioms
"prompt-intent-classifier/src/*" = ["E741"]

[format]
quote-style = "double"
indent-style = "space"
