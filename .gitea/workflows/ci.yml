name: CI

on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    name: Lint & pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need base history to diff changed files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on changed files only
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            FROM="${{ github.event.before }}"
            TO="${{ github.sha }}"
          fi
          # lint only files changed between base and head; fall back to last commit
          if [ -n "$FROM" ] && git cat-file -e "$FROM" 2>/dev/null && git cat-file -e "$TO" 2>/dev/null; then
            echo "Linting changed files: $FROM..$TO"
            pre-commit run --show-diff-on-failure --color always --from-ref "$FROM" --to-ref "$TO"
          else
            echo "Base ref unavailable; linting files changed in HEAD"
            CHANGED="$(git diff --name-only HEAD~1 HEAD || true)"
            [ -n "$CHANGED" ] && pre-commit run --show-diff-on-failure --color always --files $CHANGED || echo "no changed files to lint"
          fi

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan every commit

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history
        run: gitleaks detect --config .gitleaks.toml --redact --no-banner --verbose

  mirror-to-codecommit:
    name: Mirror to CodeCommit
    runs-on: ubuntu-latest
    needs: [lint, gitleaks]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to CodeCommit
        env:
          CC_USER: ${{ secrets.CODECOMMIT_USERNAME }}
          CC_PASS: ${{ secrets.CODECOMMIT_PASSWORD }}
        run: |
          set -euo pipefail
          enc=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['CC_PASS'],safe=''))")
          git push --no-verify \
            "https://${CC_USER}:${enc}@git-codecommit.us-east-1.amazonaws.com/v1/repos/claude-code-roi-analytics" \
            "HEAD:${GITHUB_REF}"
